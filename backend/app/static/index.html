<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUB Manager - Circle OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight">RUB Manager</h1>
        <p class="text-xs text-blue-200">Circle OS v3.0</p>
      </div>
      <span class="text-xs bg-blue-800 px-2 py-1 rounded-full text-blue-100 border border-blue-400">DB Live</span>
    </div>
    <!-- Role Switcher -->
    <div class="max-w-md mx-auto mt-3 bg-blue-700/60 p-2 rounded-lg flex items-center justify-between text-xs">
      <span class="font-medium flex items-center gap-1">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i> 現在の表示役職:
      </span>
      <select id="role-selector" onchange="changeRole(this.value)" class="bg-white text-slate-800 font-bold rounded px-2 py-1 focus:outline-none">
        <option value="代表">代表 (全機能/役職)</option>
        <option value="コート取り">コート取り (日程追加/削除可)</option>
        <option value="部員" selected>一般部員 (閲覧・出欠選択・意見送信のみ)</option>
      </select>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Tab 1: Home / AI -->
    <div id="tab-home" class="tab-content space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 mb-2">
          <i data-lucide="bot" class="w-5 h-5 text-blue-600"></i> サークルAIアシスタント
        </h2>
        <div id="ai-advice" class="text-sm text-slate-600 bg-blue-50 p-3 rounded-lg border border-blue-100 space-y-1">
          <p class="animate-pulse">AIが分析中...</p>
        </div>
      </div>
    </div>

    <!-- Tab 2: Members -->
    <div id="tab-members" class="tab-content hidden space-y-4">
      <!-- Member Add Form (Officers Only) -->
      <div id="member-add-box" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
        <h2 class="font-bold text-slate-700 mb-3 text-sm flex items-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4 text-blue-600"></i> 新規部員登録
        </h2>
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-500 mb-1">氏名</label>
            <input type="text" id="new-member-name" placeholder="例: 立教 太郎" class="w-full border rounded p-2 focus:ring-1 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">学年</label>
              <select id="new-member-grade" class="w-full border rounded p-2">
                <option value="1年">1年</option>
                <option value="2年">2年</option>
                <option value="3年">3年</option>
                <option value="4年">4年</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-500 mb-1">役職</label>
              <select id="new-member-role" class="w-full border rounded p-2">
                <option value="部員">一般部員</option>
                <option value="代表">代表</option>
                <option value="副代表">副代表</option>
                <option value="会計">会計</option>
                <option value="コート取り">コート取り</option>
              </select>
            </div>
          </div>
          <button onclick="addMember()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 mt-2">
            部員を登録
          </button>
        </div>
      </div>

      <!-- Member List -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 mb-3 text-sm flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-slate-500"></i> 部員名簿
        </h2>
        <div id="member-list" class="divide-y divide-slate-100 text-xs">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- Tab 3: Gymnasium / Practice Schedule -->
    <div id="tab-gym" class="tab-content hidden space-y-4">
      <!-- Practice Schedule Creation (Court Manager / Rep Only) -->
      <div id="practice-create-box" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative hidden">
        <span class="absolute top-3 right-3 text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded">コート取り専用</span>
        <h2 class="font-bold text-slate-700 mb-3 text-sm">練習スケジュール作成</h2>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-500 mb-1 font-medium">練習日</label>
            <input type="date" id="practice-date" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-green-500 focus:outline-none text-sm bg-slate-50">
          </div>
          <div>
            <label class="block text-slate-500 mb-1 font-medium">時間帯</label>
            <div class="grid grid-cols-2 gap-2 items-center">
              <input type="time" id="practice-start-time" value="18:00" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50">
              <div class="flex items-center gap-1">
                <span class="text-slate-400">〜</span>
                <input type="time" id="practice-end-time" value="21:00" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50">
              </div>
            </div>
          </div>
          <div>
            <label class="block text-slate-500 mb-1 font-medium">場所</label>
            <select id="practice-location" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50">
              <option value="立教大学体育館">立教大学体育館</option>
              <option value="池袋スポーツセンター">池袋スポーツセンター</option>
              <option value="豊島区立体育館">豊島区立体育館</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 mb-1 font-medium">メモ・持ち物</label>
            <input type="text" id="practice-memo" placeholder="例: ボール持参" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50">
          </div>
          <button onclick="createPractice()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-sm text-sm flex items-center justify-center gap-1">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> スケジュール作成
          </button>
        </div>
      </div>

      <!-- Practice Schedule & Attendance Voting -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 mb-3 text-sm">練習スケジュール & 出欠投票</h2>
        <div id="practice-list" class="space-y-3 text-xs">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- Tab 4: Feedback / Opinion Box -->
    <div id="tab-feedback" class="tab-content hidden space-y-4">
      <!-- General Member View: Submission Form Only -->
      <div id="feedback-form-section" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-700 mb-2 text-sm flex items-center gap-2">
          <i data-lucide="message-square-plus" class="w-4 h-4 text-blue-600"></i> サークル意見箱 (送信)
        </h2>
        <p class="text-xs text-slate-500 mb-3">サークル運営への要望や意見を匿名で送信できます（役職者のみ確認できます）。</p>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-500 mb-1 font-medium">お名前 (任意)</label>
            <input type="text" id="feedback-sender" placeholder="匿名希望の場合は空欄" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:ring-1 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-slate-500 mb-1 font-medium">ご意見・ご要望</label>
            <textarea id="feedback-content" rows="4" placeholder="例: イベントの開催頻度を増やしてほしいです。" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:ring-1 focus:ring-blue-500"></textarea>
          </div>
          <button onclick="submitFeedback()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-1">
            <i data-lucide="send" class="w-4 h-4"></i> 意見を送信する
          </button>
        </div>
      </div>

      <!-- Officers View: Feedback List Only -->
      <div id="feedback-list-section" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
            <i data-lucide="inbox" class="w-4 h-4 text-purple-600"></i> 届いたご意見一覧
          </h2>
          <span class="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">役職者限定閲覧</span>
        </div>
        <div id="feedback-list" class="space-y-2 text-xs divide-y divide-slate-100">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center py-2 text-xs">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn text-blue-600 font-bold flex flex-col items-center">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span>ホーム/AI</span>
      </button>
      <button onclick="switchTab('members')" id="nav-members" class="nav-btn text-slate-400 flex flex-col items-center">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span>部員</span>
      </button>
      <button onclick="switchTab('gym')" id="nav-gym" class="nav-btn text-slate-400 flex flex-col items-center">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span>体育館</span>
      </button>
      <button onclick="switchTab('feedback')" id="nav-feedback" class="nav-btn text-slate-400 flex flex-col items-center">
        <i data-lucide="message-square" class="w-5 h-5"></i>
        <span>意見箱</span>
      </button>
    </div>
  </nav>

  <script>
    let currentRole = "部員";

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchAIAnalytics();
      fetchMembers();
      fetchPractices();
      fetchFeedbacks();
      updateRoleVisibility();

      // デフォルトの練習日を明日に設定
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById("practice-date").value = tomorrow.toISOString().split('T')[0];
    });

    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${tabName}`).classList.remove("hidden");

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.remove("text-blue-600", "font-bold");
        btn.classList.add("text-slate-400");
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      activeBtn.classList.remove("text-slate-400");
      activeBtn.classList.add("text-blue-600", "font-bold");
    }

    function changeRole(role) {
      currentRole = role;
      updateRoleVisibility();
      fetchPractices();
      fetchMembers();
    }

    function isOfficerRole() {
      return currentRole === "代表" || currentRole === "副代表" || currentRole === "会計" || currentRole === "コート取り";
    }

    function updateRoleVisibility() {
      const isOfficer = isOfficerRole();

      // 部員追加エリア（役職持ちのみ）
      const memberAddBox = document.getElementById("member-add-box");
      if (memberAddBox) {
        if (isOfficer) memberAddBox.classList.remove("hidden");
        else memberAddBox.classList.add("hidden");
      }

      // 練習作成エリア（コート取り or 代表のみ）
      const practiceCreateBox = document.getElementById("practice-create-box");
      if (practiceCreateBox) {
        if (currentRole === "コート取り" || currentRole === "代表") {
          practiceCreateBox.classList.remove("hidden");
        } else {
          practiceCreateBox.classList.add("hidden");
        }
      }

      // 意見箱の表示切り替え（一般部員：投稿フォームのみ／役職者：一覧のみ）
      const feedbackFormSection = document.getElementById("feedback-form-section");
      const feedbackListSection = document.getElementById("feedback-list-section");

      if (isOfficer) {
        feedbackFormSection.classList.add("hidden");
        feedbackListSection.classList.remove("hidden");
      } else {
        feedbackFormSection.classList.remove("hidden");
        feedbackListSection.classList.add("hidden");
      }
    }

    // AI アナリティクス
    async function fetchAIAnalytics() {
      try {
        const res = await fetch('/api/ai/analytics');
        const data = await res.json();
        const adviceContainer = document.getElementById('ai-advice');
        adviceContainer.innerHTML = data.advice_list.map(a => `<p>• ${a}</p>`).join('');
      } catch (err) {
        console.error('AI Analytics fetch error:', err);
      }
    }

    // 部員 API
    async function fetchMembers() {
      try {
        const res = await fetch('/api/members');
        const members = await res.json();
        const list = document.getElementById('member-list');
        const isOfficer = isOfficerRole();

        if (members.length === 0) {
          list.innerHTML = '<p class="text-slate-400 py-2">部員が登録されていません。</p>';
          return;
        }

        list.innerHTML = members.map(m => `
          <div class="py-2.5 flex items-center justify-between">
            <div>
              <span class="font-bold text-slate-800">${m.name}</span>
              <span class="ml-2 text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${m.grade}</span>
              <span class="ml-1 text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-medium">${m.role}</span>
            </div>
            ${isOfficer ? `
              <button onclick="deleteMember(${m.id})" class="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded">
                削除
              </button>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        console.error('Fetch members error:', err);
      }
    }

    async function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      const grade = document.getElementById('new-member-grade').value;
      const role = document.getElementById('new-member-role').value;

      if (!name) {
        alert('氏名を入力してください。');
        return;
      }

      await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, grade, role })
      });

      document.getElementById('new-member-name').value = '';
      fetchMembers();
      fetchAIAnalytics();
    }

    async function deleteMember(id) {
      if (!confirm('本当にこの部員を削除しますか？')) return;
      await fetch(`/api/members/${id}`, { method: 'DELETE' });
      fetchMembers();
      fetchAIAnalytics();
    }

    // 練習スケジュール API
    async function fetchPractices() {
      try {
        const res = await fetch('/api/practices');
        const practices = await res.json();
        const list = document.getElementById('practice-list');
        const canDelete = currentRole === "コート取り" || currentRole === "代表";

        if (practices.length === 0) {
          list.innerHTML = '<p class="text-slate-400 py-2">予定されている練習はありません。</p>';
          return;
        }

        let html = '';
        for (const p of practices) {
          const attRes = await fetch(`/api/attendance/${p.id}`);
          const att = await attRes.json();

          html += `
            <div class="border rounded-lg p-3 bg-slate-50 space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <div class="font-bold text-sm text-slate-800">${p.date}</div>
                  <div class="text-slate-600">${p.location}</div>
                  ${p.memo ? `<div class="text-slate-500 text-[11px]">メモ: ${p.memo}</div>` : ''}
                </div>
                ${canDelete ? `
                  <button onclick="deletePractice(${p.id})" class="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded">
                    削除
                  </button>
                ` : ''}
              </div>

              <!-- 出欠投票 -->
              <div class="border-t pt-2 mt-2">
                <p class="font-medium text-slate-600 mb-1">出欠投票:</p>
                <div class="flex gap-1 mb-2">
                  <button onclick="voteAttendance(${p.id}, '参加')" class="flex-1 bg-green-500 text-white font-bold py-1 rounded hover:bg-green-600 text-xs">参加</button>
                  <button onclick="voteAttendance(${p.id}, '不参加')" class="flex-1 bg-red-500 text-white font-bold py-1 rounded hover:bg-red-600 text-xs">不参加</button>
                  <button onclick="voteAttendance(${p.id}, '未定')" class="flex-1 bg-gray-400 text-white font-bold py-1 rounded hover:bg-gray-500 text-xs">未定</button>
                </div>
                <div class="text-[11px] text-slate-500 bg-white p-2 rounded border space-y-0.5">
                  <div><span class="font-bold text-green-600">参加 (${att.参加.length}名):</span> ${att.参加.join(', ') || 'なし'}</div>
                  <div><span class="font-bold text-red-600">不参加 (${att.不参加.length}名):</span> ${att.不参加.join(', ') || 'なし'}</div>
                  <div><span class="font-bold text-gray-500">未定 (${att.未定.length}名):</span> ${att.未定.join(', ') || 'なし'}</div>
                </div>
              </div>
            </div>
          `;
        }
        list.innerHTML = html;
      } catch (err) {
        console.error('Fetch practices error:', err);
      }
    }

    async function createPractice() {
      const dateVal = document.getElementById('practice-date').value;
      const startTime = document.getElementById('practice-start-time').value;
      const endTime = document.getElementById('practice-end-time').value;
      const location = document.getElementById('practice-location').value;
      const memo = document.getElementById('practice-memo').value.trim();

      if (!dateVal) {
        alert('練習日を選択してください。');
        return;
      }

      const fullDateStr = `${dateVal} (${startTime}〜${endTime})`;

      try {
        const res = await fetch('/api/practices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: fullDateStr,
            location: location,
            memo: memo
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(`スケジュールの作成に失敗しました: ${errData.detail || 'エラーが発生しました'}`);
          return;
        }

        document.getElementById('practice-memo').value = '';
        await fetchPractices();
        alert('練習スケジュールを作成しました！');
      } catch (err) {
        console.error('Create practice error:', err);
        alert('通信エラーが発生しました。ネットワーク接続を確認してください。');
      }
    }

    async function deletePractice(id) {
      if (!confirm('この練習スケジュールを削除しますか？')) return;
      await fetch(`/api/practices/${id}`, { method: 'DELETE' });
      fetchPractices();
    }

    async function voteAttendance(practiceId, status) {
      const name = prompt('投票者のお名前を入力してください:');
      if (!name || !name.trim()) return;

      await fetch('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          practice_id: practiceId,
          member_name: name.trim(),
          status: status
        })
      });

      fetchPractices();
    }

    // 意見箱 API
    async function submitFeedback() {
      const sender_name = document.getElementById('feedback-sender').value.trim() || '匿名';
      const content = document.getElementById('feedback-content').value.trim();

      if (!content) {
        alert('ご意見・ご要望を入力してください。');
        return;
      }

      await fetch('/api/feedbacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender_name, content })
      });

      document.getElementById('feedback-content').value = '';
      document.getElementById('feedback-sender').value = '';
      alert('ご意見を送信しました。ありがとうございます！');
      if (isOfficerRole()) {
        fetchFeedbacks();
      }
    }

    async function fetchFeedbacks() {
      try {
        const res = await fetch('/api/feedbacks');
        const feedbacks = await res.json();
        const list = document.getElementById('feedback-list');

        if (feedbacks.length === 0) {
          list.innerHTML = '<p class="text-slate-400 py-2">現在届いているご意見はありません。</p>';
          return;
        }

        list.innerHTML = feedbacks.map(f => `
          <div class="py-2.5">
            <div class="flex justify-between text-slate-500 mb-1">
              <span class="font-bold text-slate-700">${f.sender_name}</span>
              <span class="text-[10px]">${new Date(f.created_at).toLocaleDateString('ja-JP')}</span>
            </div>
            <p class="text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 whitespace-pre-wrap">${f.content}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Fetch feedbacks error:', err);
      }
    }
  </script>
</body>
</html>
