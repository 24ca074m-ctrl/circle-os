<!DOCTYPE html>
<html lang="ja" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', '"Fredoka"', 'sans-serif'],
          },
          colors: {
            pickle: {
              lime: '#84cc16',
              yellow: '#facc15',
              blue: '#06b6d4',
              navy: '#0f172a',
              pink: '#f43f5e',
              bg: '#f7fee7',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .pop-shadow { box-shadow: 0 4px 0 0 #000; }
    .pop-shadow-sm { box-shadow: 0 2px 0 0 #000; }
    .pop-border { border: 2px solid #000; }
  </style>
</head>
<body class="bg-pickle-bg dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-24">

  <script>
    const SUPABASE_URL = 'https://awafhqvdfqiizftulefk.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_AtovIC4zDu8jKCaWhrW4lg_2rSSwSXo';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- サークル選択 / 新規開設モーダル -->
  <div id="circle-setup-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[120] flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 pop-border pop-shadow space-y-4 text-slate-800 dark:text-slate-100">
      <div class="text-center space-y-1">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-pickle-yellow rounded-full pop-border mb-1">
          <i data-lucide="sparkles" class="w-7 h-7 text-slate-900"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 dark:text-white tracking-wider">Circle OS</h1>
        <p class="text-xs font-bold text-slate-500 dark:text-slate-400">サークル運営プラットフォーム</p>
      </div>

      <div class="flex border-2 border-slate-800 rounded-xl overflow-hidden text-xs font-black">
        <button onclick="switchSetupTab('join')" id="tab-btn-join" class="w-1/2 py-2 bg-pickle-yellow text-slate-900">IDで参加</button>
        <button onclick="switchSetupTab('create')" id="tab-btn-create" class="w-1/2 py-2 bg-slate-100 dark:bg-slate-700 text-slate-500">新規開設</button>
      </div>

      <!-- 参加フォーム -->
      <div id="setup-form-join" class="space-y-3 text-xs">
        <div>
          <label class="block font-extrabold text-slate-700 dark:text-slate-300 mb-1">サークルID</label>
          <input type="text" id="input-circle-id" placeholder="例: RUB-PICKLE" class="w-full border-2 border-slate-800 dark:border-slate-600 dark:bg-slate-700 p-2.5 rounded-xl font-bold uppercase">
        </div>
        <button onclick="joinCircle()" class="w-full bg-pickle-lime text-slate-900 font-black py-3 rounded-xl text-sm pop-border pop-shadow-sm">
          サークルに入る 🚀
        </button>
      </div>

      <!-- 新規開設フォーム -->
      <div id="setup-form-create" class="space-y-3 text-xs hidden">
        <div>
          <label class="block font-extrabold text-slate-700 dark:text-slate-300 mb-1">大学名</label>
          <input type="text" id="create-university" placeholder="例: 立教大学" class="w-full border-2 border-slate-800 dark:border-slate-600 dark:bg-slate-700 p-2 rounded-xl font-bold">
        </div>
        <div>
          <label class="block font-extrabold text-slate-700 dark:text-slate-300 mb-1">サークル名</label>
          <input type="text" id="create-circle-name" placeholder="例: RUB Picklers" class="w-full border-2 border-slate-800 dark:border-slate-600 dark:bg-slate-700 p-2 rounded-xl font-bold">
        </div>
        <div>
          <label class="block font-extrabold text-slate-700 dark:text-slate-300 mb-1">希望サークルID (半角英数字)</label>
          <input type="text" id="create-circle-id" placeholder="例: TEST01" class="w-full border-2 border-slate-800 dark:border-slate-600 dark:bg-slate-700 p-2 rounded-xl font-bold uppercase">
        </div>
        <button onclick="createNewCircle()" class="w-full bg-pickle-blue text-white font-black py-3 rounded-xl text-sm pop-border pop-shadow-sm">
          サークルを立ち上げる ✨
        </button>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ表示用 -->
  <header class="bg-pickle-lime text-slate-900 p-4 pop-border border-t-0 border-x-0 sticky top-0 z-50 flex justify-between items-center">
    <div>
      <h1 id="header-circle-name" class="text-xl font-black">Circle OS</h1>
      <p id="header-univ-name" class="text-[10px] font-extrabold text-slate-700">準備中</p>
    </div>
    <button onclick="resetCircleSelection()" class="text-xs bg-white text-slate-900 px-2.5 py-1 rounded-xl pop-border font-black">切替</button>
  </header>

  <main class="max-w-md mx-auto p-4">
    <div id="status-box" class="bg-white dark:bg-slate-800 p-4 rounded-3xl pop-border pop-shadow text-center">
      <p class="font-bold text-sm">サークルを選択するか、新規開設してください。</p>
    </div>
  </main>

  <script>
    function switchSetupTab(mode) {
      if (mode === 'join') {
        document.getElementById('setup-form-join').classList.remove('hidden');
        document.getElementById('setup-form-create').classList.add('hidden');
        document.getElementById('tab-btn-join').className = "w-1/2 py-2 bg-pickle-yellow text-slate-900";
        document.getElementById('tab-btn-create').className = "w-1/2 py-2 bg-slate-100 dark:bg-slate-700 text-slate-500";
      } else {
        document.getElementById('setup-form-join').classList.add('hidden');
        document.getElementById('setup-form-create').classList.remove('hidden');
        document.getElementById('tab-btn-join').className = "w-1/2 py-2 bg-slate-100 dark:bg-slate-700 text-slate-500";
        document.getElementById('tab-btn-create').className = "w-1/2 py-2 bg-pickle-blue text-white";
      }
    }

    async function createNewCircle() {
      const univ = document.getElementById('create-university').value.trim();
      const name = document.getElementById('create-circle-name').value.trim();
      const id = document.getElementById('create-circle-id').value.trim().toUpperCase();

      if (!univ || !name || !id) return alert('全ての項目を入力してください。');

      // クラウドDBへ挿入
      const { data, error } = await db.from('circles').insert([{ id: id, name: name, university: univ, locations: ["メイン体育館"] }]);

      if (error) {
        console.error("Supabase Error:", error);
        return alert(`作成失敗: ${error.message}\n(IDを変えてもう一度お試しください)`);
      }

      const currentCircle = { id, name, university: univ };
      localStorage.setItem('active_circle', JSON.stringify(currentCircle));
      alert(`サークル「${name}」を作成しました！`);
      initAppUI();
    }

    async function joinCircle() {
      const id = document.getElementById('input-circle-id').value.trim().toUpperCase();
      if (!id) return alert('サークルIDを入力してください');

      const { data, error } = await db.from('circles').select('*').eq('id', id);

      if (error || !data || data.length === 0) {
        return alert('該当するサークルIDが見つかりません。正確なIDを入力するか、新規開設してください。');
      }

      const currentCircle = data[0];
      localStorage.setItem('active_circle', JSON.stringify(currentCircle));
      alert(`サークル「${currentCircle.name}」に入りました！`);
      initAppUI();
    }

    function initAppUI() {
      const saved = localStorage.getItem('active_circle');
      if (!saved) {
        document.getElementById('circle-setup-modal').classList.remove('hidden');
        return;
      }
      const circle = JSON.parse(saved);
      document.getElementById('circle-setup-modal').classList.add('hidden');
      document.getElementById('header-circle-name').innerText = circle.name;
      document.getElementById('header-univ-name').innerText = circle.university;
      document.getElementById('status-box').innerHTML = `<p class="font-black text-pickle-lime text-base">🎉 ${circle.name} (${circle.university}) に接続中！</p>`;
    }

    function resetCircleSelection() {
      localStorage.removeItem('active_circle');
      location.reload();
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initAppUI();
    });
  </script>
</body>
</html>
